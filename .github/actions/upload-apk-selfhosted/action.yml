name: Upload APK to self-hosted
description: >
  GitHub Actions 在云端临时 runner 上打包；APK 先只存在于该 runner。本 action 通过 SSH/SCP 推到你配置的机器上的 LOCAL_APK_REMOTE_DIR
  （例如服务器上与 Nginx/反代 root 一致的绝对路径，如桌面的 fileshare）。不会写入 Git 仓库。
  勿将 LOCAL_APK_SSH_HOST 设为 127.0.0.1（从 runner 看那是虚拟机自身，不是你的桌面）。
  目录规则（与 scripts/publish-apk-local.sh 一致）：
  - Debug: REMOTE/debug/versionName/branch-shortSha/mikutoyou-debug-SHA.apk
  - Release: REMOTE/release/tag/mikutoyou-tag.apk
  versionName 从 android/app/build.gradle 解析。需在调用 step 的 env 中传入 LOCAL_APK_* secrets。

inputs:
  build_mode:
    description: debug 或 release
    required: true
  apk_path:
    description: 相对仓库根目录的 APK 路径
    required: true

runs:
  using: composite
  steps:
    - name: SCP to self-hosted
      shell: bash
      env:
        BUILD_MODE: ${{ inputs.build_mode }}
        APK_PATH: ${{ inputs.apk_path }}
      run: |
        set -euo pipefail
        MODE="${BUILD_MODE}"
        APK="${APK_PATH}"

        if [[ ! -f "$APK" ]]; then
          echo "APK missing at $APK" >&2
          exit 1
        fi

        TAG="${GITHUB_REF_NAME}"
        SHORT_SHA="${GITHUB_SHA:0:7}"
        SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"

        GRADLE_FILE="android/app/build.gradle"
        if [[ ! -f "$GRADLE_FILE" ]]; then
          echo "Missing $GRADLE_FILE" >&2
          exit 1
        fi
        VERSION_NAME="$(grep -E 'versionName\s+"' "$GRADLE_FILE" | head -1 | sed -E 's/.*versionName[[:space:]]+"([^"]+)".*/\1/')"
        if [[ -z "${VERSION_NAME}" ]]; then
          echo "Could not parse versionName from $GRADLE_FILE" >&2
          exit 1
        fi

        if [[ "$MODE" == "debug" ]]; then
          APK_NAME="mikutoyou-debug-${SHORT_SHA}.apk"
        elif [[ "$MODE" == "release" ]]; then
          APK_NAME="mikutoyou-${TAG}.apk"
        else
          echo "Invalid build_mode: $MODE (expected debug or release)" >&2
          exit 1
        fi

        DEFAULT_FALLBACK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"

        if [[ -z "${LOCAL_APK_SSH_HOST:-}" || -z "${LOCAL_APK_SSH_USER:-}" || \
              -z "${LOCAL_APK_SSH_KEY:-}" || -z "${LOCAL_APK_REMOTE_DIR:-}" || \
              -z "${LOCAL_APK_BASE_URL:-}" ]]; then
          echo '::warning::LOCAL_APK_* secrets 未配置，已跳过 SCP；自建目录不会出现新包。请在仓库 Settings → Secrets 中填写 LOCAL_APK_SSH_HOST / USER / KEY / REMOTE_DIR / BASE_URL。'
          {
            echo '## 自建 APK 上传 — 已跳过'
            echo ''
            echo '**说明**：打包在 **GitHub 托管 runner（临时虚拟机）** 上完成；若不执行本步 SCP，APK **只会**留在该虚拟机直至 job 结束，或作为 **Actions Artifacts** 在网页上下载，**不会**出现在你桌面的 fileshare 目录。'
            echo ''
            echo '未检测到完整的 `LOCAL_APK_*` Secrets，未执行 SSH/SCP。'
            echo ''
            echo '请在仓库 **Settings → Secrets and variables → Actions** 配置：`LOCAL_APK_SSH_HOST`（能从公网 SSH 到的地址，**不要**填 `127.0.0.1`）、`LOCAL_APK_SSH_USER`、`LOCAL_APK_SSH_KEY`、`LOCAL_APK_REMOTE_DIR`（**目标机器上**与 HTTP 根一致的绝对路径）、`LOCAL_APK_BASE_URL`（可选 `LOCAL_APK_SSH_PORT`）。'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "$MODE" == "release" ]]; then
            echo "Self-host secrets missing; skip SCP upload and keep fallback release URL."
            echo "APK_DOWNLOAD_URL=${DEFAULT_FALLBACK_URL}" >> "${GITHUB_ENV}"
          else
            echo "LOCAL_APK_* secrets not set; skip SCP (debug APK still in Actions artifacts)."
          fi
          exit 0
        fi

        REMOTE_ROOT="${LOCAL_APK_REMOTE_DIR%/}"
        if [[ "$MODE" == "debug" ]]; then
          SUBDIR="${VERSION_NAME}/${SAFE_BRANCH}-${SHORT_SHA}"
          REMOTE_PATH="${REMOTE_ROOT}/debug/${SUBDIR}"
          URL_SUFFIX="debug/${SUBDIR}/${APK_NAME}"
        else
          REMOTE_PATH="${REMOTE_ROOT}/release/${TAG}"
          URL_SUFFIX="release/${TAG}/${APK_NAME}"
        fi

        PORT="${LOCAL_APK_SSH_PORT:-22}"
        echo "== 自建上传说明 =="
        echo "APK 当前在 GitHub runner 的临时目录；下面通过 SCP 推送到 **你的机器**（SSH 目标），写入磁盘路径："
        echo "  ${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}:${REMOTE_PATH}/"
        echo "（LOCAL_APK_REMOTE_DIR 即你在 Secrets 里配置的、应与反代 root 一致的本机/服务器目录）"
        if [[ "${LOCAL_APK_SSH_HOST}" == "127.0.0.1" || "${LOCAL_APK_SSH_HOST}" == "localhost" ]]; then
          echo '::warning::LOCAL_APK_SSH_HOST 为 127.0.0.1/localhost 时，从 GitHub runner 连接的是 **runner 自己**，不是你的桌面。请改为公网可达的主机名或 IP（例如云服务器 IP）。'
        fi
        mkdir -p ~/.ssh
        KEY_FILE="${HOME}/.ssh/mikutoyou_apk_deploy"
        # Secret 若从网页粘贴易带 CRLF，会导致私钥无效；仅用于本 job 的临时文件
        printf '%s\n' "${LOCAL_APK_SSH_KEY}" | tr -d '\r' > "${KEY_FILE}"
        chmod 600 "${KEY_FILE}"
        ssh-keyscan -p "${PORT}" "${LOCAL_APK_SSH_HOST}" >> ~/.ssh/known_hosts
        SSH_OPTS=(-i "${KEY_FILE}" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30)
        ssh "${SSH_OPTS[@]}" -p "${PORT}" "${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}" "mkdir -p '${REMOTE_PATH}'"
        scp "${SSH_OPTS[@]}" -P "${PORT}" "$APK" "${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}:${REMOTE_PATH}/${APK_NAME}"
        DOWNLOAD_URL="${LOCAL_APK_BASE_URL%/}/${URL_SUFFIX}"

        # 固定「最新」路径，便于反代根目录直达（不依赖版本号/SHA 子目录）。
        if [[ "$MODE" == "debug" ]]; then
          LATEST_DIR="${REMOTE_ROOT}/debug/latest"
          LATEST_NAME="mikutoyou-debug.apk"
          LATEST_URL="${LOCAL_APK_BASE_URL%/}/debug/latest/${LATEST_NAME}"
        else
          LATEST_DIR="${REMOTE_ROOT}/release/latest"
          LATEST_NAME="mikutoyou-release.apk"
          LATEST_URL="${LOCAL_APK_BASE_URL%/}/release/latest/${LATEST_NAME}"
        fi
        ssh "${SSH_OPTS[@]}" -p "${PORT}" "${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}" \
          "mkdir -p '${LATEST_DIR}' && cp -f '${REMOTE_PATH}/${APK_NAME}' '${LATEST_DIR}/${LATEST_NAME}'"

        if [[ "$MODE" == "release" ]]; then
          echo "APK_DOWNLOAD_URL=${DOWNLOAD_URL}" >> "${GITHUB_ENV}"
        fi

        if [[ "$MODE" == "debug" ]]; then
          {
            echo "### 自建服务 Debug APK"
            echo ""
            echo "文件已写入 **SSH 目标机** 磁盘：\`${REMOTE_PATH}/\`（与 GitHub runner 无关）。"
            echo ""
            echo "**本次构建（按版本/分支归档）**： \`${DOWNLOAD_URL}\`"
            echo ""
            echo "**固定「最新」Debug（覆盖写入）**： \`${LATEST_URL}\`"
            echo ""
            echo "**远端路径**： \`${REMOTE_PATH}/${APK_NAME}\` → \`${LATEST_DIR}/${LATEST_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
        else
          {
            echo "### 自建服务 Release APK"
            echo ""
            echo "文件已写入 **SSH 目标机** 磁盘：\`${REMOTE_PATH}/\`（与 GitHub runner 无关）。"
            echo ""
            echo "**本次标签**： \`${DOWNLOAD_URL}\`"
            echo ""
            echo "**固定「最新」Release（覆盖写入）**： \`${LATEST_URL}\`"
            echo ""
            echo "**远端路径**： \`${REMOTE_PATH}/${APK_NAME}\` → \`${LATEST_DIR}/${LATEST_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
        fi
