# main 推送 / 手动触发：在 GitHub 云端 runner 构建 debug APK；Artifact 留在 GitHub；若配置了 LOCAL_APK_*，再通过 SCP 推到「你指定主机」上的目录（非 runner 本机磁盘）。
# 归档路径：{LOCAL_APK_REMOTE_DIR}/debug/{versionName}/{分支-安全}-{短SHA}/mikutoyou-debug-{短SHA}.apk
# 固定「最新」：{LOCAL_APK_REMOTE_DIR}/debug/latest/mikutoyou-debug.apk（每次覆盖）
# HTTP 示例：http://47.94.166.44:6001/debug/latest/mikutoyou-debug.apk
# Secrets：LOCAL_APK_SSH_*、LOCAL_APK_REMOTE_DIR、LOCAL_APK_BASE_URL（与 release 相同）。
name: Android Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # steps.if 不允许使用 secrets 上下文；经 job env 中转后可用 env 判断
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build debug
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK to self-hosted server
        uses: ./.github/actions/upload-apk-selfhosted
        with:
          build_mode: debug
          apk_path: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          LOCAL_APK_SSH_HOST: ${{ secrets.LOCAL_APK_SSH_HOST }}
          LOCAL_APK_SSH_PORT: ${{ secrets.LOCAL_APK_SSH_PORT }}
          LOCAL_APK_SSH_USER: ${{ secrets.LOCAL_APK_SSH_USER }}
          LOCAL_APK_SSH_KEY: ${{ secrets.LOCAL_APK_SSH_KEY }}
          LOCAL_APK_REMOTE_DIR: ${{ secrets.LOCAL_APK_REMOTE_DIR }}
          LOCAL_APK_BASE_URL: ${{ secrets.LOCAL_APK_BASE_URL }}
      - name: Notify build (success)
        if: success() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFY_EMAIL_TO != '' && env.NOTIFY_EMAIL_FROM != ''
        uses: ./.github/actions/send-build-notification
        with:
          notify_outcome: success
          build_type: debug
          ref_name: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
          artifact_name: app-debug
      - name: Notify build (failure)
        if: failure() && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFY_EMAIL_TO != '' && env.NOTIFY_EMAIL_FROM != ''
        uses: ./.github/actions/send-build-notification
        with:
          notify_outcome: failure
          build_type: debug
          ref_name: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
          artifact_name: app-debug
