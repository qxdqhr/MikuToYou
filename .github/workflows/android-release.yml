# Release：打 tag v* 触发。自建下载站需配置 GitHub Secrets：
#   LOCAL_APK_SSH_HOST      例 47.94.166.44
#   LOCAL_APK_SSH_PORT    可选，默认 22
#   LOCAL_APK_SSH_USER    SSH 用户
#   LOCAL_APK_SSH_KEY     私钥全文（ed25519 等）
#   LOCAL_APK_REMOTE_DIR  远端根目录，应对 HTTP 根目录，例 /home/<user>/share-downloads
#   LOCAL_APK_BASE_URL    公网访问根，例 http://47.94.166.44:6001（勿尾斜杠亦可）
#   LOCAL_APK_PATH_PREFIX 可选；不设则 releases/<仓库名>，与注释内 OSS 路径一致；设为 "." 则 <REMOTE_DIR>/<tag>/ 扁平布局
name: Android Release Asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mikutoyou-release-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Write signing properties
        run: |
          cat >> android/gradle.properties <<PROPS
          MYAPP_UPLOAD_STORE_FILE=mikutoyou-release-key.jks
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Sync release tag into app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm run sync:release-tag
      - name: Build release
        run: |
          cd android
          ./gradlew assembleRelease
      # - name: Install ossutil
