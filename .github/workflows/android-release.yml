# Release：打 tag v* 触发。自建文件服务需配置 GitHub Secrets：
#   LOCAL_APK_SSH_HOST      例 47.94.166.44
#   LOCAL_APK_SSH_PORT      可选，默认 22
#   LOCAL_APK_SSH_USER      SSH 用户
#   LOCAL_APK_SSH_KEY       私钥全文（ed25519 等）
#   LOCAL_APK_REMOTE_DIR    HTTP 根目录在机器上的绝对路径，例 /home/qhr/Desktop/shared-downloads
#   LOCAL_APK_BASE_URL      公网访问根，例 http://47.94.166.44:6001（勿尾斜杠亦可）
# 归档路径：{LOCAL_APK_REMOTE_DIR}/release/{tag}/mikutoyou-{tag}.apk
# 固定「最新」：{LOCAL_APK_REMOTE_DIR}/release/latest/mikutoyou-release.apk（每次覆盖）
# HTTP 示例：http://47.94.166.44:6001/release/latest/mikutoyou-release.apk
name: Android Release Asset

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # steps.if 不允许使用 secrets 上下文；经 job env 中转后可用 env 判断
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mikutoyou-release-key.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Write signing properties
        run: |
          cat >> android/gradle.properties <<PROPS
          MYAPP_UPLOAD_STORE_FILE=mikutoyou-release-key.jks
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Sync release tag into app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm run sync:release-tag
      - name: Build release
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload release APK to Aliyun OSS (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/upload-apk-aliyun-oss
      - name: Upload release APK to self-hosted server
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/upload-apk-selfhosted
        with:
          build_mode: release
          apk_path: android/app/build/outputs/apk/release/app-release.apk
        env:
          LOCAL_APK_SSH_HOST: ${{ secrets.LOCAL_APK_SSH_HOST }}
          LOCAL_APK_SSH_PORT: ${{ secrets.LOCAL_APK_SSH_PORT }}
          LOCAL_APK_SSH_USER: ${{ secrets.LOCAL_APK_SSH_USER }}
          LOCAL_APK_SSH_KEY: ${{ secrets.LOCAL_APK_SSH_KEY }}
          LOCAL_APK_REMOTE_DIR: ${{ secrets.LOCAL_APK_REMOTE_DIR }}
          LOCAL_APK_BASE_URL: ${{ secrets.LOCAL_APK_BASE_URL }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
      - name: Notify build (success)
        if: success() && startsWith(github.ref, 'refs/tags/') && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFY_EMAIL_TO != '' && env.NOTIFY_EMAIL_FROM != ''
        uses: ./.github/actions/send-build-notification
        with:
          notify_outcome: success
          build_type: release
          ref_name: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
      - name: Notify build (failure)
        if: failure() && startsWith(github.ref, 'refs/tags/') && env.SMTP_SERVER != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFY_EMAIL_TO != '' && env.NOTIFY_EMAIL_FROM != ''
        uses: ./.github/actions/send-build-notification
        with:
          notify_outcome: failure
          build_type: release
          ref_name: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          run_id: ${{ github.run_id }}
          commit_sha: ${{ github.sha }}
