      #     echo "OSS virtual-host URL: ${LINK1}"
      #     echo "OSS path/CDN URL:      ${LINK2}"
      # 远程目录与 OSS 注释块一致：{REMOTE_DIR}/releases/{仓库名}/{tag}/mikutoyou-{tag}.apk
      # 可选 secrets.LOCAL_APK_PATH_PREFIX：覆盖 releases/<repo>（设为 "." 则退化为 {REMOTE_DIR}/{tag}/，兼容旧布局）
      - name: Upload release APK to self-hosted server
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LOCAL_APK_SSH_HOST: ${{ secrets.LOCAL_APK_SSH_HOST }}
          LOCAL_APK_SSH_PORT: ${{ secrets.LOCAL_APK_SSH_PORT }}
          LOCAL_APK_SSH_USER: ${{ secrets.LOCAL_APK_SSH_USER }}
          LOCAL_APK_SSH_KEY: ${{ secrets.LOCAL_APK_SSH_KEY }}
          LOCAL_APK_REMOTE_DIR: ${{ secrets.LOCAL_APK_REMOTE_DIR }}
          LOCAL_APK_BASE_URL: ${{ secrets.LOCAL_APK_BASE_URL }}
          LOCAL_APK_PATH_PREFIX: ${{ secrets.LOCAL_APK_PATH_PREFIX }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          TAG="${GITHUB_REF_NAME}"
          APK_NAME="mikutoyou-${TAG}.apk"
          DEFAULT_FALLBACK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "Release APK missing at $APK" >&2
            exit 1
          fi
          if [[ -z "${LOCAL_APK_SSH_HOST:-}" || -z "${LOCAL_APK_SSH_USER:-}" || \
                -z "${LOCAL_APK_SSH_KEY:-}" || -z "${LOCAL_APK_REMOTE_DIR:-}" || \
                -z "${LOCAL_APK_BASE_URL:-}" ]]; then
            echo "Self-host secrets missing; skip SCP upload and keep fallback release URL."
            echo "APK_DOWNLOAD_URL=${DEFAULT_FALLBACK_URL}" >> "${GITHUB_ENV}"
            exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ -z "${LOCAL_APK_PATH_PREFIX:-}" ]]; then
            PATH_PREFIX="releases/${REPO_NAME}"
          else
            PATH_PREFIX="${LOCAL_APK_PATH_PREFIX}"
          fi
          if [[ "${PATH_PREFIX}" == "." ]]; then
            REMOTE_PATH="${LOCAL_APK_REMOTE_DIR%/}/${TAG}"
            URL_SUFFIX="${TAG}/${APK_NAME}"
          else
            REMOTE_PATH="${LOCAL_APK_REMOTE_DIR%/}/${PATH_PREFIX}/${TAG}"
            URL_SUFFIX="${PATH_PREFIX}/${TAG}/${APK_NAME}"
          fi
          PORT="${LOCAL_APK_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "${LOCAL_APK_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT}" "${LOCAL_APK_SSH_HOST}" >> ~/.ssh/known_hosts
          ssh -p "${PORT}" "${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}" "mkdir -p '${REMOTE_PATH}'"
          scp -P "${PORT}" "$APK" "${LOCAL_APK_SSH_USER}@${LOCAL_APK_SSH_HOST}:${REMOTE_PATH}/${APK_NAME}"
          DOWNLOAD_URL="${LOCAL_APK_BASE_URL%/}/${URL_SUFFIX}"
          echo "APK_DOWNLOAD_URL=${DOWNLOAD_URL}" >> "${GITHUB_ENV}"
          {
            echo "### 自建服务 APK（目录规则对齐 OSS：releases/<仓库>/<tag>/）"
            echo ""
            echo "**下载**： \`${DOWNLOAD_URL}\`"
            echo ""
            echo "**远端路径**： \`${REMOTE_PATH}/${APK_NAME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
      - name: Send success email with APK link
        if: success() && startsWith(github.ref, 'refs/tags/') && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.NOTIFY_EMAIL_TO != '' && secrets.NOTIFY_EMAIL_FROM != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[MikuToYou] APK 打包成功 ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            APK 打包成功。

            Tag: ${{ github.ref_name }}
            下载地址: ${{ env.APK_DOWNLOAD_URL }}
            Release 页面: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Send failure email
        if: failure() && startsWith(github.ref, 'refs/tags/') && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.NOTIFY_EMAIL_TO != '' && secrets.NOTIFY_EMAIL_FROM != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[MikuToYou] APK 打包失败 ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            APK 打包失败，请查看 Actions 日志。

            Tag: ${{ github.ref_name }}
            日志入口: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
